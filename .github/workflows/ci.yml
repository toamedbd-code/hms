name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: hms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_DATABASE: hms_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_HOST: 127.0.0.1
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, ctype, json, pdo_mysql, pdo_sqlite
          ini-values: post_max_size=256M, memory_limit=2G

      - name: Validate composer
        run: composer --version

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare .env
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          sed -i "s/DB_CONNECTION=.*/DB_CONNECTION=${DB_CONNECTION}/" .env
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=${DB_DATABASE}/" .env
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=${DB_USERNAME}/" .env
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=${DB_PASSWORD}/" .env
          sed -i "s/DB_HOST=.*/DB_HOST=${DB_HOST}/" .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h"${{ env.DB_HOST }}" --silent; do sleep 1; done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: composer test:ci
