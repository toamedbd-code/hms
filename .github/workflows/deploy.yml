name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run remote deploy script via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT || '22' }}
          key: ${{ secrets.SSH_KEY }}
          # Set timeout high enough for composer/migrations
          timeout: 30m
          script: |
            set -e
            echo "Deploy started on $(date)"
            cd ${{ secrets.PROD_PATH }}
            # ensure repo up to date
            git fetch --all --prune
            git reset --hard origin/main
            # Keep cPanel's PHP 8.3 handler after git reset overwrites its generated .htaccess setting.
            if ! grep -q 'AddHandler application/x-httpd-ea-php83' .htaccess; then
              cat >> .htaccess <<'PHP83_HANDLER'

# cPanel PHP 8.3 handler
<IfModule mime_module>
  AddHandler application/x-httpd-ea-php83 .php .php8 .phtml
</IfModule>
PHP83_HANDLER
            fi
            # install php deps (optional, safe to run)
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --prefer-dist --optimize-autoloader
            fi
            # run project-specific safe scripts
            if [ -f scripts/disable_subscription_enforce.php ]; then
              php scripts/disable_subscription_enforce.php || true
            fi
            if [ -f scripts/activate_subscription_db.php ]; then
              php scripts/activate_subscription_db.php || true
            fi
            # Clear stale config before applying the production database-backed stores.
            php artisan config:clear
            set_env_value() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            set_env_value CACHE_DRIVER database
            set_env_value QUEUE_CONNECTION database
            set_env_value APP_VERSION 2.2.2
            set_env_value WEB_SETTING_CACHE_TTL_SECONDS 1800
            set_env_value SIDE_MENU_CACHE_TTL_SECONDS 900
            set_env_value ACTIVITY_LOG_ALERT_CACHE_TTL_SECONDS 60
            set_env_value MEDICINE_EXPIRY_ALERT_CACHE_TTL_SECONDS 180
            set_env_value DASHBOARD_NET_INCOME_CACHE_TTL_SECONDS 60
            set_env_value CASH_COUNTER_INFO_CACHE_TTL_SECONDS 30
            # Create/upgrade database-backed cache, session and queue tables before use.
            php artisan migrate --force
            CACHE_DRIVER=database php artisan cache:clear
            # Clear remaining caches and warm safe production caches.
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan config:cache
            php artisan view:cache
            php artisan route:cache
            php artisan queue:restart
            # restart php-fpm if service name provided
            if [ -n "${{ secrets.PHP_FPM_SERVICE }}" ]; then
              sudo systemctl restart "${{ secrets.PHP_FPM_SERVICE }}" || true
            fi
            echo "Deploy finished on $(date)"
